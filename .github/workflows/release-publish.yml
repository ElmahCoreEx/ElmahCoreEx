name: Publish Release

# One-click stable release of all packages:
#
#   1. resolves the version from the release draft (or the version input)
#   2. makes sure changelog.md has a section for it, rolling "## Unreleased"
#      into a version heading if the notes were collected there
#   3. commits any changelog change to main and tags it
#   4. calls release.yml, which builds, tests, packs, and publishes to NuGet
#   5. publishes the release draft with contributor attribution
#
# All packages (ElmahCoreEx, ElmahCoreEx.Common, ElmahCoreEx.Sql, ElmahCoreEx.MySql,
# ElmahCoreEx.Postgresql) take their version from the tag through MinVer, so this
# releases the whole set. Tags have no "v" prefix.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 3.0.1. Leave empty to use the drafted version.'
        required: false
        type: string
      dry-run:
        description: 'Dry run — resolve the version and show the changelog roll without tagging or publishing'
        required: false
        default: true
        type: boolean

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    # Needs write to push the changelog commit and the release tag.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check branch
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Releases must be published from main (got $GITHUB_REF_NAME)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: resolve
        # The input is passed through the environment, never interpolated into
        # the script — a workflow_dispatch input is attacker-controlled text.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"

          if [ -z "$version" ]; then
            version=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              --jq '[.[] | select(.draft)] | .[0].tag_name // ""')
            if [ -z "$version" ]; then
              echo "::error::No release draft found — pass an explicit version input"
              exit 1
            fi
            echo "Resolved from release draft: $version"
          fi

          version=${version#v}

          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not a stable MAJOR.MINOR.PATCH version. Pre-releases are tagged by hand."
            exit 1
          fi

          tag="$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi

          # Release Drafter resolves the previous version from published GitHub
          # Releases, not from git tags. If it sees none it drafts 0.0.1, which
          # would publish NuGet packages below the versions already out there —
          # and NuGet versions cannot be reused. Refuse anything that is not an
          # increase over the highest existing stable tag. Pre-release tags
          # (2.5.0-alpha.0) are left out: sort -V orders 2.5.0 before them.
          latest=$(git tag --list '[0-9]*' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -n "$latest" ] && \
             [ "$(printf '%s\n%s\n' "$version" "$latest" | sort -V | head -n1)" = "$version" ]; then
            echo "::error::$tag is not an increase over the latest tag $latest. If the release draft is wrong, pass an explicit version input."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - name: Roll changelog
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: bash .github/scripts/roll-changelog.sh "$TAG"

      - name: Show changelog diff
        run: git --no-pager diff -- changelog.md

      - name: Dry run summary
        if: ${{ inputs.dry-run }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          {
            echo "### Dry run — nothing was published"
            echo
            echo "Would release **$TAG** with the changelog change (if any) shown in the job log."
            echo
            echo "Re-run with **dry-run** unchecked to tag and publish."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and tag
        if: ${{ !inputs.dry-run }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if ! git diff --quiet -- changelog.md; then
            git add changelog.md
            git commit -m "chore: roll changelog for $TAG"
            git push origin HEAD:main
            echo "Committed the changelog roll to main — merge main back into develop." >> "$GITHUB_STEP_SUMMARY"
          fi

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  release:
    name: Release
    needs: prepare
    if: ${{ !inputs.dry-run }}
    # A tag pushed with GITHUB_TOKEN does not trigger release.yml's `push: tags`
    # trigger, so it has to be called directly.
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: read
    secrets: inherit

  publish-notes:
    name: Publish release notes
    needs: [prepare, release]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # Captured before publishing, because once this release is published it
      # becomes "latest" and can no longer serve as the previous tag.
      - name: Resolve previous release tag
        id: previous
        run: |
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
                   --limit 1 --json tagName --jq '.[0].tagName // ""')
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          echo "Previous release tag: ${prev:-<none>}"

      # Publishes the rolling draft that Release Drafter has been accumulating
      # from merged PRs. Published with GITHUB_TOKEN, so it does not fire
      # release.yml's `release: published` trigger a second time.
      - name: Publish GitHub Release
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          publish: true
          tag: ${{ env.TAG }}
          name: ${{ env.TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Release Drafter has no first-time-contributor detection, so borrow
      # GitHub's own and append its "New Contributors" section to the notes.
      - name: Append new contributors
        env:
          PREV: ${{ steps.previous.outputs.tag }}
        run: |
          if [ -n "$PREV" ]; then
            generated=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" -f previous_tag_name="$PREV" --jq .body)
          else
            generated=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body)
          fi

          printf '%s\n' "$generated" | awk '/^## New Contributors/ { found = 1 } found { print }' > new-contributors.md

          if [ ! -s new-contributors.md ]; then
            echo "No new contributors in this release."
            exit 0
          fi

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          printf '\n' >> notes.md
          cat new-contributors.md >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          echo "Appended:"
          cat new-contributors.md
