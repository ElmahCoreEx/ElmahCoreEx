name: build

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: pwsh

on:
  push:
    branches: [main, develop]
    tags-ignore: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Unit tests (ElmahCore.Tests)
        run: dotnet test Tests/ElmahCore.Tests --no-restore --verbosity normal

      - name: Unit tests (ElmahCore.Mvc.Tests)
        run: dotnet test Tests/ElmahCore.Mvc.Tests --no-restore --verbosity normal

  integration:
    # Starts SQL Server in Docker via Testcontainers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Integration tests
        run: dotnet test Tests/ElmahCore.IntegrationTests --verbosity normal
